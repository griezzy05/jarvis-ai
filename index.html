<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Jarvis - AI Voice Assistant</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2847 100%);
            color: #e2e8f0;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #334155;
        }
        .logo { font-size: 24px; font-weight: 800; color: #60a5fa; }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: #064e3b;
            color: #86efac;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .voice-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .voice-title { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }
        .voice-subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
        
        .listening-indicator {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #60a5fa;
            background: linear-gradient(135deg, #1e40af 0%, #1e293b 100%);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
        }
        .listening-indicator.active {
            animation: listening-pulse 0.4s infinite;
            background: linear-gradient(135deg, #dc2626 0%, #1e293b 100%);
            border-color: #dc2626;
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.5);
        }
        @keyframes listening-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .voice-status { font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
        
        .voice-transcript {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            min-height: 40px;
            font-size: 12px;
            color: #60a5fa;
        }
        
        .voice-response {
            background: #064e3b;
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            min-height: 50px;
            font-size: 12px;
            color: #86efac;
            line-height: 1.4;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .kpi-card {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
        }
        .kpi-value { font-size: 20px; font-weight: 800; color: #60a5fa; margin: 4px 0; }
        .progress-bar { height: 3px; background: #334155; border-radius: 2px; overflow: hidden; margin: 4px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3b82f6, #60a5fa); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🚀 Jarvis</div>
            <div class="status" id="status">
                <div class="status-dot"></div>
                <span>Ready</span>
            </div>
        </div>
        
        <div class="voice-section">
            <div class="voice-title">🎙️ Voice Assistant</div>
            <div class="voice-subtitle">Say "Jarvis" + your command</div>
            
            <div class="listening-indicator" id="indicator">🎤</div>
            <div class="voice-status" id="voiceStatus">Listening for "Jarvis"...</div>
            
            <div class="voice-transcript" id="transcript">Ready...</div>
            <div class="voice-response" id="response">Say "Jarvis" to start</div>
        </div>
        
        <div class="kpi-grid">
            <div class="kpi-card">
                <div>CCNA</div>
                <div class="kpi-value">72%</div>
                <div class="progress-bar"><div class="progress-fill" style="width: 72%;"></div></div>
            </div>
            <div class="kpi-card">
                <div>Study Hrs</div>
                <div class="kpi-value">4/5</div>
                <div class="progress-bar"><div class="progress-fill" style="width: 80%;"></div></div>
            </div>
            <div class="kpi-card">
                <div>Loytex</div>
                <div class="kpi-value">1.5K</div>
                <div class="progress-bar"><div class="progress-fill" style="width: 75%;"></div></div>
            </div>
            <div class="kpi-card">
                <div>FarmLink</div>
                <div class="kpi-value">18/30</div>
                <div class="progress-bar"><div class="progress-fill" style="width: 60%;"></div></div>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://jarvis-backend-syzv.onrender.com';
        
        const indicator = document.getElementById('indicator');
        const voiceStatus = document.getElementById('voiceStatus');
        const transcript = document.getElementById('transcript');
        const response = document.getElementById('response');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        
        const synth = window.speechSynthesis;
        
        let inConversation = false;
        let lastFinalResultIndex = -1;
        
        recognition.start();
        
        recognition.addEventListener('result', (event) => {
            let interimTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcriptSegment = event.results[i][0].transcript.toLowerCase();
                
                if (event.results[i].isFinal) {
                    if (i > lastFinalResultIndex) {
                        lastFinalResultIndex = i;
                        
                        if (!inConversation && transcriptSegment.includes('jarvis')) {
                            inConversation = true;
                            indicator.classList.add('active');
                            voiceStatus.textContent = 'Ready for command...';
                            transcript.textContent = '"Jarvis" detected!';
                            response.textContent = 'Listening for your command...';
                        } else if (inConversation) {
                            transcript.textContent = transcriptSegment;
                            voiceStatus.textContent = 'Processing...';
                            processCommand(transcriptSegment);
                            inConversation = false;
                            indicator.classList.remove('active');
                            voiceStatus.textContent = 'Listening for "Jarvis"...';
                        }
                    }
                } else {
                    if (!inConversation) {
                        interimTranscript += transcriptSegment + ' ';
                    }
                }
            }
            
            if (interimTranscript && !inConversation) {
                transcript.textContent = interimTranscript;
            }
        });
        
        recognition.addEventListener('end', () => {
            recognition.start();
        });
        
        async function processCommand(command) {
            try {
                const res = await fetch(`${BACKEND_URL}/api/command`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                
                const data = await res.json();
                const reply = data.response || 'No response';
                response.textContent = reply;
                speak(reply);
            } catch (error) {
                console.error('Error:', error);
                response.textContent = '❌ Error: ' + error.message;
            }
        }
        
        function speak(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 1;
            synth.speak(utterance);
        }
    </script>
</body>
</html>
