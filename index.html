<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>Jarvis - AI Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1a2847 100%);
            color: #e2e8f0;
            padding: 16px;
            min-height: 100vh;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #334155;
        }
        .logo { font-size: 24px; font-weight: 800; color: #60a5fa; }
        
        .voice-section {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .voice-title { font-size: 18px; font-weight: 700; color: white; margin-bottom: 4px; }
        .voice-subtitle { font-size: 11px; color: #94a3b8; margin-bottom: 12px; }
        
        .listening-indicator {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 3px solid #60a5fa;
            background: linear-gradient(135deg, #1e40af 0%, #1e293b 100%);
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 0 30px rgba(96, 165, 250, 0.3);
        }
        .listening-indicator.active {
            animation: listening-pulse 0.4s infinite;
            background: linear-gradient(135deg, #dc2626 0%, #1e293b 100%);
            border-color: #dc2626;
            box-shadow: 0 0 50px rgba(220, 38, 38, 0.5);
        }
        @keyframes listening-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .voice-status { font-size: 13px; color: #94a3b8; margin-bottom: 10px; font-weight: 600; }
        
        .voice-transcript {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            min-height: 40px;
            font-size: 12px;
            color: #60a5fa;
        }
        
        .voice-response {
            background: #064e3b;
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
            min-height: 50px;
            font-size: 12px;
            color: #86efac;
            line-height: 1.4;
        }
        
        button {
            background: #60a5fa;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin: 10px 0;
        }
        button:active { background: #3b82f6; }
        
        .debug { background: #0f172a; border: 1px solid #334155; padding: 10px; margin-top: 10px; font-size: 10px; color: #94a3b8; max-height: 80px; overflow-y: auto; border-radius: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🚀 Jarvis</div>
        </div>
        
        <div class="voice-section">
            <div class="voice-title">🎙️ Voice Assistant</div>
            <div class="voice-subtitle">Click button or say "Jarvis"</div>
            
            <div class="listening-indicator" id="indicator">🎤</div>
            <div class="voice-status" id="voiceStatus">Ready...</div>
            
            <button onclick="startListening()">🎤 Start Listening</button>
            
            <div class="voice-transcript" id="transcript">Waiting for input...</div>
            <div class="voice-response" id="response">Click button to begin</div>
            
            <div class="debug" id="debug">Debug log...</div>
        </div>
    </div>

    <script>
        // USER DATA - ALL IN ONE PLACE
        const jarvisData = {
            ccna: { progress: 12, nextTopic: "Network Fundamentals", weeksLeft: 20 },
            loytex: { commission: 3000, monthlyAverage: 6000 },
            farmlink: { status: "Final stages", priority: "CRITICAL" },
            schedule: { school: "2:30 PM" }
        };
        
        // SMART RESPONSES
        function getSmartResponse(command) {
            const cmd = command.toLowerCase();
            
            if (cmd.includes('ccna')) {
                return `Your CCNA is at ${jarvisData.ccna.progress}%. Next topic: ${jarvisData.ccna.nextTopic}. You need ${jarvisData.ccna.weeksLeft} weeks. Stay consistent!`;
            }
            if (cmd.includes('loytex')) {
                return `You earn ${jarvisData.loytex.commission} Kenyan Shillings from Loytex every 2 weeks. Monthly average: ${jarvisData.loytex.monthlyAverage} Shillings. Great work!`;
            }
            if (cmd.includes('farmlink')) {
                return `FarmLink is in ${jarvisData.farmlink.status}. Priority #1: Complete it fully this week. You're almost there!`;
            }
            if (cmd.includes('school') || cmd.includes('schedule')) {
                return `Your school is at ${jarvisData.schedule.school}. Be there on time and manage your study schedule.`;
            }
            if (cmd.includes('progress') || cmd.includes('how')) {
                return `You're doing great! CCNA at ${jarvisData.ccna.progress}%, earning ${jarvisData.loytex.commission} from Loytex, FarmLink almost done. Focus on completing FarmLink this week!`;
            }
            return `I can help with CCNA, Loytex, FarmLink, your schedule, or your progress. What would you like to know?`;
        }
        
        // VOICE RECOGNITION
        const indicator = document.getElementById('indicator');
        const voiceStatus = document.getElementById('voiceStatus');
        const transcript = document.getElementById('transcript');
        const response = document.getElementById('response');
        const debug = document.getElementById('debug');
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        
        const synth = window.speechSynthesis;
        // Pre-warm voice synthesis on page load
window.addEventListener('load', () => {
    const dummy = new SpeechSynthesisUtterance('');
    synth.speak(dummy);
    synth.cancel();
    log('✅ Voice ready');
});
        let isListening = false;
        let inConversation = false;
        let conversationTimeout = null;
        const CONVERSATION_DURATION = 120000;
        
        function log(msg) {
            debug.textContent = new Date().toLocaleTimeString() + ' > ' + msg + '\n' + debug.textContent;
        }
        
        function startListening() {
            if (isListening) return;
            isListening = true;
            log('🎙️ Listening...');
            indicator.classList.add('active');
            voiceStatus.textContent = 'Listening...';
            transcript.textContent = 'Speak now...';
            recognition.start();
        }
        
        function enterConversationMode() {
            inConversation = true;
            log('✅ Conversation mode (2 min)');
            voiceStatus.textContent = '💬 Say your command';
            response.textContent = 'Ready...';
            
            if (conversationTimeout) clearTimeout(conversationTimeout);
            conversationTimeout = setTimeout(() => {
                exitConversationMode();
            }, CONVERSATION_DURATION);
            
            startListening();
        }
        
        function exitConversationMode() {
            inConversation = false;
            isListening = false;
            log('Exit: Conversation ended');
            indicator.classList.remove('active');
            voiceStatus.textContent = 'Ready';
            if (conversationTimeout) clearTimeout(conversationTimeout);
        }
        
        recognition.addEventListener('result', (event) => {
            let interimTranscript = '';
            let finalTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const seg = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += seg + ' ';
                } else {
                    interimTranscript += seg;
                }
            }
            
            if (interimTranscript) {
                transcript.textContent = 'Hearing: ' + interimTranscript;
            }
            
            if (finalTranscript) {
                transcript.textContent = 'You said: ' + finalTranscript.trim();
                log('Final: ' + finalTranscript.trim());
                
                if (!inConversation && finalTranscript.toLowerCase().includes('jarvis')) {
                    log('✅ Wake word detected');
                    enterConversationMode();
                } else if (inConversation) {
                    log('Processing...');
                    processCommand(finalTranscript.trim());
                    isListening = false;
                }
            }
        });
        
        recognition.addEventListener('end', () => {
            if (inConversation) {
                log('Restarting...');
                setTimeout(() => startListening(), 300);
            } else {
                isListening = false;
                indicator.classList.remove('active');
            }
        });
        
        recognition.addEventListener('error', (event) => {
            log('❌ Error: ' + event.error);
            isListening = false;
            indicator.classList.remove('active');
        });
        
        function processCommand(command) {
            voiceStatus.textContent = 'Processing...';
            
            // INSTANT local response
            const reply = getSmartResponse(command);
            log('Response: ' + reply.substring(0, 40) + '...');
            response.textContent = reply;
            
            speakClear(reply);
        }
        function speakInBackground(text) {
    if (synth.speaking) synth.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    utterance.onstart = () => {
        log('🔊 Speaking...');
    };
    
    utterance.onend = () => {
        log('✅ Done');
        if (inConversation) {
            voiceStatus.textContent = '💬 Ready for next';
            startListening();
        }
    };
    
    synth.speak(utterance);
}
        function speakClear(text) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.95;
            utterance.pitch = 1.0;
            utterance.volume = 1.0;
            
            utterance.onend = () => {
                log('Done - Ready for next');
                if (inConversation) {
                    voiceStatus.textContent = '💬 Ready for next';
                    startListening();
                }
            };
            
            synth.speak(utterance);
        }
    </script>
</body>
</html>
